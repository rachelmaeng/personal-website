<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rachel Maeng</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            overflow-x: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── BORDER FRAMES ── */
        #ms-frame-outer {
            position: fixed;
            inset: 14px;
            border: 1.5px solid rgba(200, 146, 42, 0.7);
            border-radius: 2px;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            animation: frameIn 1.0s ease-out 0.1s forwards;
        }
        #ms-frame-inner {
            position: fixed;
            inset: 22px;
            border: 1px solid rgba(200, 146, 42, 0.35);
            border-radius: 1px;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            animation: frameIn 1.0s ease-out 0.35s forwards;
        }
        @keyframes frameIn { to { opacity: 1; } }

        /* ── CORNER ORNAMENTS ── */
        .ms-corner {
            position: fixed;
            width: 240px;
            height: 240px;
            z-index: 3;
            pointer-events: none;
        }
        #corner-tl { top: 0; left: 0; }
        #corner-tr { top: 0; right: 0;    transform: scaleX(-1); }
        #corner-bl { bottom: 0; left: 0;  transform: scaleY(-1); }
        #corner-br { bottom: 0; right: 0; transform: scale(-1,-1); }

        /* Vine draw-in */
        .ms-vine {
            animation: msDraw 3.2s cubic-bezier(0.25, 0.1, 0.25, 1) 0.2s forwards;
        }
        .ms-vine-b {
            animation: msDraw 2.2s cubic-bezier(0.25, 0.1, 0.25, 1) 1.4s forwards;
        }
        .ms-vine-c {
            animation: msDraw 1.6s cubic-bezier(0.25, 0.1, 0.25, 1) 2.0s forwards;
        }
        @keyframes msDraw { to { stroke-dashoffset: 0; } }

        /* Element bloom */
        .ms-bloom {
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
            animation: msBloom 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes msBloom {
            from { opacity: 0; transform: scale(0.1); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* ── CONTENT ANIMATIONS ── */
        .in-name {
            opacity: 0;
            animation: inLeft 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
        }
        .in-korean {
            opacity: 0;
            animation: inUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
        }
        .in-tag1 {
            opacity: 0;
            animation: inUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 1.1s forwards;
        }
        .in-tag2 {
            opacity: 0;
            animation: inUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 1.3s forwards;
        }
        .in-nav {
            opacity: 0;
            animation: inUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 1.5s forwards;
        }
        .in-social {
            opacity: 0;
            animation: inUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 1.7s forwards;
        }
        @keyframes inLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes inUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── PAGE CONTENT ── */
        .home-content {
            position: relative;
            z-index: 4;
            padding: 4rem 3rem;
            max-width: 680px;
            width: 100%;
            text-align: center;
        }

        .main-name {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(4rem, 7vw, 6.5rem);
            font-weight: 500;
            font-style: italic;
            color: var(--light-green);
            margin: 0 0 0.3rem 0;
            line-height: 1.05;
            letter-spacing: -0.02em;
        }

        .korean-name {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(1.4rem, 2.5vw, 1.9rem);
            color: var(--accent);
            font-style: italic;
            margin: 0 0 2.5rem 0;
        }

        .tagline {
            font-size: clamp(1rem, 1.6vw, 1.15rem);
            line-height: 1.7;
            color: var(--medium-gray);
            margin: 0 0 0.6rem 0;
            font-weight: 300;
        }

        .tagline + .tagline { margin-bottom: 2.8rem; }

        .highlight {
            color: var(--highlight, #2D5A27);
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1.5px;
            text-decoration-color: var(--highlight, #2D5A27);
        }

        /* Nav */
        .simple-nav {
            display: flex;
            gap: 3rem;
            margin-bottom: 2.8rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .simple-nav a {
            font-size: 1rem;
            color: var(--medium-gray);
            text-decoration: none;
            transition: color 0.25s ease;
            font-weight: 400;
        }
        .simple-nav a:hover { color: var(--accent); }

        /* Social icons */
        .social-icons {
            display: flex;
            gap: 0.9rem;
            align-items: center;
            justify-content: center;
        }
        .social-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--light-green);
            transition: all 0.25s ease;
            cursor: pointer;
            background: transparent;
        }
        .social-icon:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }
        .social-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Copy feedback */
        .copy-feedback {
            position: fixed;
            background: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            transform: translate(-50%, -100%);
            margin-top: -10px;
        }
        .copy-feedback.show { opacity: 1; }

        /* Responsive */
        @media (max-width: 768px) {
            .home-content {
                padding: 5rem 2rem 4rem 2rem;
                max-width: 100%;
            }
            .simple-nav { gap: 1.8rem; }
            .ms-corner { width: 160px; height: 160px; }
        }
    </style>
</head>
