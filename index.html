<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rachel Maeng</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            overflow: hidden;
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            margin: 0;
        }

        /* -- CONTENT ANIMATIONS -- */
        .in-name {
            opacity: 0;
            animation: inLeft 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
        }
        .in-korean {
            opacity: 0;
            animation: inUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
        }
        .in-tag1 {
            opacity: 0;
            animation: inUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 1.1s forwards;
        }
        .in-tag2 {
            opacity: 0;
            animation: inUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 1.3s forwards;
        }
        .in-nav {
            opacity: 0;
            animation: inUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 1.5s forwards;
        }
        .in-social {
            opacity: 0;
            animation: inUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 1.7s forwards;
        }
        @keyframes inLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes inUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* -- PAGE CONTENT -- */
        .home-content {
            position: fixed;
            bottom: 3.5rem;
            right: 4rem;
            z-index: 4;
            padding: 2rem;
            max-width: 420px;
            text-align: left;
        }

        .main-name {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(1.8rem, 3vw, 2.4rem);
            font-weight: 500;
            font-style: italic;
            color: var(--light-green);
            margin: 1.5rem 0 0.2rem 0;
            line-height: 1.05;
            letter-spacing: -0.02em;
        }

        .korean-name {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(1rem, 1.5vw, 1.3rem);
            color: var(--accent);
            font-style: italic;
            margin: 0 0 2.5rem 0;
        }

        .tagline {
            font-size: clamp(0.85rem, 1.3vw, 1rem);
            line-height: 1.7;
            color: var(--medium-gray);
            margin: 0 0 0.6rem 0;
            font-weight: 300;
            white-space: nowrap;
        }

        .tagline + .tagline { margin-bottom: 2.8rem; }

        .highlight {
            color: var(--highlight, #2B4C7E);
            text-decoration: none;
        }

        /* Nav */
        .simple-nav {
            display: flex;
            gap: 2rem;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }
        .simple-nav a {
            font-size: 0.75rem;
            color: var(--medium-gray);
            text-decoration: none;
            transition: color 0.25s ease;
            font-weight: 400;
            letter-spacing: 0.12em;
        }
        .simple-nav a:hover { color: var(--accent); }

        /* Social icons */
        .social-icons {
            display: flex;
            gap: 0.7rem;
            align-items: center;
        }
        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--medium-gray);
            opacity: 0.6;
            transition: all 0.25s ease;
            cursor: pointer;
            background: transparent;
        }
        .social-icon:hover {
            color: var(--accent);
            opacity: 1;
            transform: translateY(-2px);
        }
        .social-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Copy feedback */
        .copy-feedback {
            position: fixed;
            background: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            transform: translate(-50%, -100%);
            margin-top: -10px;
        }
        .copy-feedback.show { opacity: 1; }


        /* Responsive */
        @media (max-width: 768px) {
            .home-content {
                padding: 5rem 2rem 4rem 2rem;
                max-width: 100%;
            }
            .simple-nav { gap: 1.8rem; }
        }
    </style>
</head>
<body>
    <canvas id="constellation-canvas"></canvas>

    <!-- Clickable moon hitbox -->
    <a href="https://science.nasa.gov/moon/daily-moon-guide/" target="_blank" id="moon-link" style="
        position: fixed;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        z-index: 5;
        cursor: pointer;
    "></a>

    <!-- Copy Feedback -->
    <div class="copy-feedback" id="copyFeedback">Email copied!</div>

    <!-- Main content -->
    <main class="home-content">
        <h1 class="main-name in-name">Rachel Maeng</h1>
        <p class="korean-name in-korean">맹지현</p>

        <p class="tagline in-tag1">
            interested in <span class="highlight">health</span>, <span class="highlight">history</span>, and <span class="highlight">technology</span>
        </p>
        <nav class="simple-nav in-nav">
            <a href="about.html">about</a>
            <a href="building.html">projects</a>
            <a href="writing.html">writing</a>
            <a href="consuming.html">consuming</a>
        </nav>

        <div class="social-icons in-social">
            <span class="social-icon" onclick="copyEmail(event)" title="Copy email">
                <svg viewBox="0 0 24 24">
                    <path d="M1.5 8.67v8.58a3 3 0 003 3h15a3 3 0 003-3V8.67l-8.928 5.493a3 3 0 01-3.144 0L1.5 8.67z"/>
                    <path d="M22.5 6.908V6.75a3 3 0 00-3-3h-15a3 3 0 00-3 3v.158l9.714 5.978a1.5 1.5 0 001.572 0L22.5 6.908z"/>
                </svg>
            </span>
            <a href="https://www.linkedin.com/in/rachelhmaeng/" target="_blank" class="social-icon" title="LinkedIn">
                <svg viewBox="0 0 24 24">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
            </a>
            <a href="https://substack.com/@rachelmaeng" target="_blank" class="social-icon" title="Substack">
                <svg viewBox="0 0 24 24">
                    <path d="M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24L12 18.11 22.54 24V10.812H1.46zM22.54 0H1.46v2.836h21.08V0z"/>
                </svg>
            </a>
            <a href="https://x.com/rachelhmaeng" target="_blank" class="social-icon" title="X">
                <svg viewBox="0 0 24 24">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
            </a>
        </div>
    </main>

    <script src="effects.js?v=100"></script>
    <script>
        function copyEmail(event) {
            const email = 'rachelmaeng03@gmail.com';
            navigator.clipboard.writeText(email).then(() => {
                const feedback = document.getElementById('copyFeedback');
                feedback.style.left = event.clientX + 'px';
                feedback.style.top = event.clientY + 'px';
                feedback.classList.add('show');
                setTimeout(() => feedback.classList.remove('show'), 2000);
            });
        }
    </script>
</body>
</html>
