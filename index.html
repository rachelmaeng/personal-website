<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rachel Maeng</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            overflow-x: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .split-layout {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            gap: 6rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Left Side - Content */
        .left-content {
            flex: 1;
            max-width: 500px;
        }

        .name-section {
            margin-bottom: 2rem;
        }

        .main-name {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 3.5rem;
            font-weight: 500;
            font-style: italic;
            color: var(--light-green);
            margin: 0;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .korean-name-display {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.5rem;
            color: var(--accent);
            margin-top: 0.5rem;
            font-style: italic;
        }

        .tagline {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--medium-gray);
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .highlight {
            color: var(--accent);
            position: relative;
            display: inline;
        }

        .highlight::after {
            content: '';
            position: absolute;
            left: -2px;
            right: -2px;
            bottom: 0px;
            height: 3px;
            background: var(--accent);
            opacity: 0.7;
            border-radius: 2px;
            /* Chalk-like rough edge effect */
            mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 4' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 2 Q5 0, 10 2 T20 2 T30 2 T40 2 T50 2 T60 2 T70 2 T80 2 T90 2 T100 2' stroke='black' fill='none' stroke-width='4'/%3E%3C/svg%3E");
            -webkit-mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 4' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 2 Q5 0, 10 2 T20 2 T30 2 T40 2 T50 2 T60 2 T70 2 T80 2 T90 2 T100 2' stroke='black' fill='none' stroke-width='4'/%3E%3C/svg%3E");
            mask-size: 20px 100%;
            -webkit-mask-size: 20px 100%;
        }

        /* Simple Navigation */
        .simple-nav {
            display: flex;
            gap: 2rem;
            margin-bottom: 2.5rem;
        }

        .simple-nav a {
            font-size: 0.95rem;
            color: var(--medium-gray);
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 400;
        }

        .simple-nav a:hover {
            color: var(--light-green);
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--light-green);
            font-size: 0.85rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .social-icon:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        .social-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Right Side - Film Strip Photo */
        .right-content {
            flex-shrink: 0;
        }

        /* Ornate Gold Frame */
        .gold-frame {
            position: relative;
            display: inline-block;
            transform: rotate(2deg);
            transition: transform 0.4s ease;
        }

        .gold-frame:hover {
            transform: rotate(0deg) scale(1.02);
        }

        .gold-frame-inner {
            position: relative;
            padding: 18px;
            background: linear-gradient(145deg, #D4A843, #B8860B, #DAA520, #C5961E, #E8C452, #B8860B);
            border-radius: 3px;
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.5),
                inset 0 2px 4px rgba(255, 235, 170, 0.5),
                inset 0 -2px 4px rgba(100, 60, 10, 0.5);
        }

        /* Outer ornate border */
        .gold-frame-inner::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 3px solid rgba(255, 220, 130, 0.6);
            border-radius: 2px;
            box-shadow:
                inset 0 0 6px rgba(139, 69, 19, 0.4),
                0 0 6px rgba(255, 215, 0, 0.2);
            pointer-events: none;
        }

        /* Inner ornate border */
        .gold-frame-inner::after {
            content: '';
            position: absolute;
            inset: 10px;
            border: 2px solid rgba(180, 130, 50, 0.5);
            border-radius: 1px;
            box-shadow:
                inset 0 0 8px rgba(100, 50, 10, 0.3);
            pointer-events: none;
        }

        /* Corner ornaments */
        .frame-corner {
            position: absolute;
            width: 28px;
            height: 28px;
            z-index: 2;
        }

        .frame-corner::before,
        .frame-corner::after {
            content: '';
            position: absolute;
            background: linear-gradient(145deg, #E8C452, #B8860B);
            border-radius: 50%;
        }

        .frame-corner::before {
            width: 14px;
            height: 14px;
            top: 2px;
            left: 2px;
            box-shadow:
                inset 0 1px 2px rgba(255, 235, 170, 0.6),
                inset 0 -1px 2px rgba(100, 50, 10, 0.4),
                0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .frame-corner::after {
            width: 8px;
            height: 8px;
            top: 5px;
            left: 5px;
            background: linear-gradient(145deg, #F0D470, #C5961E);
            box-shadow: inset 0 1px 1px rgba(255, 255, 200, 0.5);
        }

        .frame-corner.top-left { top: -4px; left: -4px; }
        .frame-corner.top-right { top: -4px; right: -4px; transform: rotate(90deg); }
        .frame-corner.bottom-left { bottom: -4px; left: -4px; transform: rotate(-90deg); }
        .frame-corner.bottom-right { bottom: -4px; right: -4px; transform: rotate(180deg); }

        /* Edge ornaments */
        .frame-edge-ornament {
            position: absolute;
            z-index: 2;
        }

        .frame-edge-ornament::before {
            content: '❧';
            font-size: 12px;
            color: #E8C452;
            text-shadow: 0 1px 2px rgba(100, 50, 10, 0.5);
            filter: drop-shadow(0 0 1px rgba(255, 215, 0, 0.3));
        }

        .frame-edge-ornament.top { top: 2px; left: 50%; transform: translateX(-50%); }
        .frame-edge-ornament.bottom { bottom: 2px; left: 50%; transform: translateX(-50%) rotate(180deg); }
        .frame-edge-ornament.left-edge { top: 50%; left: 3px; transform: translateY(-50%) rotate(-90deg); }
        .frame-edge-ornament.right-edge { top: 50%; right: 3px; transform: translateY(-50%) rotate(90deg); }

        .gold-frame img {
            width: 240px;
            height: 320px;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 1;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        /* Polaroid developing effect */
        .photo-develop-wrapper {
            position: relative;
            display: block;
            width: 240px;
            height: 320px;
        }

        .photo-develop-wrapper img {
            animation: polaroidReveal 4s ease-out forwards;
        }

        /* Developing overlay that fades away */
        .photo-develop-overlay {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            animation: developFade 4s ease-out forwards;
            background:
                linear-gradient(
                    180deg,
                    rgba(245, 237, 216, 1) 0%,
                    rgba(245, 237, 216, 0.98) 20%,
                    rgba(230, 215, 180, 0.95) 40%,
                    rgba(245, 237, 216, 0.97) 60%,
                    rgba(245, 237, 216, 1) 100%
                );
        }

        /* Chemical wash streaks */
        .photo-develop-overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(95deg,
                    transparent 0%,
                    rgba(200, 180, 140, 0.3) 20%,
                    transparent 40%,
                    rgba(210, 190, 150, 0.2) 60%,
                    transparent 80%
                );
            animation: chemicalWash 3.5s ease-in-out forwards;
            opacity: 0;
        }

        /* Warm tint that fades as photo develops */
        .photo-develop-overlay::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(180, 140, 60, 0.15) 0%,
                rgba(160, 120, 50, 0.1) 50%,
                rgba(180, 140, 60, 0.15) 100%
            );
            animation: tintFade 5s ease-out forwards;
        }

        @keyframes polaroidReveal {
            0% {
                filter: brightness(1.8) contrast(0.3) saturate(0) sepia(0.3);
            }
            25% {
                filter: brightness(1.4) contrast(0.5) saturate(0.2) sepia(0.4);
            }
            50% {
                filter: brightness(1.15) contrast(0.75) saturate(0.5) sepia(0.3);
            }
            75% {
                filter: brightness(1.05) contrast(0.9) saturate(0.8) sepia(0.1);
            }
            100% {
                filter: brightness(1) contrast(1) saturate(1.05) sepia(0);
            }
        }

        @keyframes developFade {
            0% { opacity: 1; }
            15% { opacity: 0.95; }
            30% { opacity: 0.7; }
            50% { opacity: 0.4; }
            70% { opacity: 0.15; }
            85% { opacity: 0.05; }
            100% { opacity: 0; }
        }

        @keyframes chemicalWash {
            0% { opacity: 0; transform: translateY(0); }
            20% { opacity: 0.6; transform: translateY(-5%); }
            50% { opacity: 0.4; transform: translateY(-15%); }
            80% { opacity: 0.1; transform: translateY(-30%); }
            100% { opacity: 0; transform: translateY(-40%); }
        }

        @keyframes tintFade {
            0% { opacity: 1; }
            60% { opacity: 0.4; }
            100% { opacity: 0; }
        }

        /* Copy Feedback */
        .copy-feedback {
            position: fixed;
            background-color: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            transform: translate(-50%, -100%);
            margin-top: -10px;
        }

        .copy-feedback.show {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .split-layout {
                flex-direction: column-reverse;
                gap: 3rem;
                padding: 3rem 1.5rem;
            }

            .left-content {
                text-align: center;
                max-width: 100%;
            }

            .main-name {
                font-size: 2.5rem;
            }

            .simple-nav {
                justify-content: center;
                width: 100%;
                flex-wrap: wrap;
            }

            .social-icons {
                justify-content: center;
            }

            .gold-frame img {
                width: 220px;
                height: 290px;
            }
        }
    </style>
</head>
<body>

    <div class="split-layout">

    <script src="effects.js"></script>
    <script>
        function copyEmail(event) {
            const email = 'rachelmaeng03@gmail.com';
            navigator.clipboard.writeText(email).then(() => {
                const feedback = document.getElementById('copyFeedback');
                feedback.style.left = event.clientX + 'px';
                feedback.style.top = event.clientY + 'px';
                feedback.classList.add('show');
                setTimeout(() => {
                    feedback.classList.remove('show');
                }, 2000);
            });
        }

    </script>
