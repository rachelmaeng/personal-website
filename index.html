<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <style>
        body {
            overflow-x: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .split-layout {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            gap: 6rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Left Side - Content */
        .left-content {
            flex: 1;
            max-width: 500px;
        }

        .name-section {
            margin-bottom: 2rem;
        }

        .main-name {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 3.5rem;
            font-weight: 500;
            font-style: italic;
            color: var(--light-green);
            margin: 0;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .korean-name-display {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.5rem;
            color: var(--accent);
            margin-top: 0.5rem;
            font-style: italic;
        }

        .tagline {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--medium-gray);
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .highlight {
            color: var(--accent);
            position: relative;
            display: inline;
        }

        .highlight::after {
            content: '';
            position: absolute;
            left: -2px;
            right: -2px;
            bottom: 0px;
            height: 3px;
            background: var(--accent);
            opacity: 0.7;
            border-radius: 2px;
            /* Chalk-like rough edge effect */
            mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 4' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 2 Q5 0, 10 2 T20 2 T30 2 T40 2 T50 2 T60 2 T70 2 T80 2 T90 2 T100 2' stroke='black' fill='none' stroke-width='4'/%3E%3C/svg%3E");
            -webkit-mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 4' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 2 Q5 0, 10 2 T20 2 T30 2 T40 2 T50 2 T60 2 T70 2 T80 2 T90 2 T100 2' stroke='black' fill='none' stroke-width='4'/%3E%3C/svg%3E");
            mask-size: 20px 100%;
            -webkit-mask-size: 20px 100%;
        }

        /* Simple Navigation */
        .simple-nav {
            display: flex;
            gap: 2rem;
            margin-bottom: 2.5rem;
        }

        .simple-nav a {
            font-size: 0.95rem;
            color: var(--medium-gray);
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 400;
        }

        .simple-nav a:hover {
            color: var(--light-green);
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--light-green);
            font-size: 0.85rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .social-icon:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        .social-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Right Side - Film Strip Photo */
        .right-content {
            flex-shrink: 0;
        }

        .film-strip {
            background: linear-gradient(180deg,
                #5C3317 0%,
                #8B4513 5%,
                #CD853F 15%,
                #DEB887 50%,
                #CD853F 85%,
                #8B4513 95%,
                #5C3317 100%);
            padding: 0;
            position: relative;
            transform: rotate(2deg);
            transition: transform 0.4s ease;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.5),
                inset 0 0 30px rgba(0, 0, 0, 0.2);
            border-radius: 1px;
        }

        /* Film grain texture overlay */
        .film-strip::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.15;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 10;
            border-radius: 1px;
        }

        /* Subtle light leak effect */
        .film-strip::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 30%;
            background: linear-gradient(135deg, rgba(255, 150, 50, 0.15) 0%, transparent 60%);
            pointer-events: none;
            z-index: 11;
            border-radius: 1px;
        }

        .film-strip:hover {
            transform: rotate(0deg) scale(1.02);
        }

        /* Sprocket holes container */
        .sprockets {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2px 0;
            z-index: 2;
        }

        .sprockets.left {
            left: 2px;
        }

        .sprockets.right {
            right: 2px;
        }

        .sprocket-hole {
            width: 8px;
            height: 5px;
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            border-radius: 1px;
            margin: 0 auto;
            box-shadow:
                inset 0 1px 1px rgba(255,255,255,0.1),
                0 0 0 0.5px rgba(0,0,0,0.5);
        }

        /* Black frame around image */
        .film-frame {
            background: #050505;
            margin: 12px 22px;
            padding: 3px;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .film-strip img {
            width: 240px;
            height: 320px;
            object-fit: cover;
            display: block;
            filter: saturate(1.05) contrast(1.02);
        }

        /* DX Code bars */
        .dx-code {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: 1px;
            z-index: 3;
        }

        .dx-code.left-code {
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
        }

        .dx-code.right-code {
            right: 22px;
            top: 50%;
            transform: translateY(-50%);
        }

        .dx-bar {
            width: 2px;
            background: #1a0a00;
        }

        /* Film edge text - top */
        .film-text-top {
            position: absolute;
            top: 3px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Courier New', monospace;
            font-size: 5px;
            color: #3d2817;
            font-weight: bold;
            letter-spacing: 0.5px;
            z-index: 3;
            text-shadow: 0 0 1px rgba(255,200,100,0.3);
        }

        /* Film edge text - bottom */
        .film-text-bottom {
            position: absolute;
            bottom: 3px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Courier New', monospace;
            font-size: 5px;
            color: #3d2817;
            font-weight: bold;
            letter-spacing: 0.5px;
            z-index: 3;
            text-shadow: 0 0 1px rgba(255,200,100,0.3);
        }

        .frame-number {
            font-size: 7px;
            color: #2a1508;
            font-weight: bold;
        }

        .film-brand {
            font-size: 6px;
            letter-spacing: 1px;
        }

        /* Copy Feedback */
        .copy-feedback {
            position: fixed;
            background-color: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            transform: translate(-50%, -100%);
            margin-top: -10px;
        }

        .copy-feedback.show {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .split-layout {
                flex-direction: column-reverse;
                gap: 3rem;
                padding: 3rem 1.5rem;
            }

            .left-content {
                text-align: center;
                max-width: 100%;
            }

            .main-name {
                font-size: 2.5rem;
            }

            .simple-nav {
                justify-content: center;
                width: 100%;
                flex-wrap: wrap;
            }

            .social-icons {
                justify-content: center;
            }

            .polaroid {
                transform: rotate(2deg);
            }

            .polaroid img {
                width: 240px;
                height: 300px;
            }
        }
    </style>
</head>

    <script>
        function copyEmail(event) {
            const email = 'rachelmaeng03@gmail.com';
            navigator.clipboard.writeText(email).then(() => {
                const feedback = document.getElementById('copyFeedback');
                feedback.style.left = event.clientX + 'px';
                feedback.style.top = event.clientY + 'px';
                feedback.classList.add('show');
                setTimeout(() => {
                    feedback.classList.remove('show');
                }, 2000);
            });
        }
